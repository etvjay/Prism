    label: default development/runtime environment for Bundle 3T
    status: ACCEPTED
    starknet:
      network: SN_SEPOLIA
      chain_id: SN_SEPOLIA
      expected_env_var: STARKNET_RPC_URL
      expected_public_env_var: NEXT_PUBLIC_STARKNET_RPC_URL
      expected_network_env_var: NEXT_PUBLIC_STARKNET_NETWORK
