# ---------------------------------------------------------------------------
# Validation rules encoded here (re-checked by ops/target-network/validate.mjs
# and by the evidence envelope / harness). Any violation blocks promotion.
# ---------------------------------------------------------------------------

validation_rules:
  - id: R01_environment_scoped
    rule: "No global default network — every run must select an environment key (testnet|mainnet)."
  - id: R02_no_silent_accept
    rule: "status PROPOSED cannot be consumed as ACCEPTED. Consumer must check owner_decision.status == ACCEPTED."
  - id: R03_chainId_binding
    rule: "Base chainId must equal manifest base.chain_id for the selected environment (84532 for testnet, 8453 for mainnet) — X maturity test asserts altered_fields:chain_id on mismatch."
  - id: R04_starknet_network_binding
    rule: "Starknet network must equal manifest starknet.network for the selected environment."
  - id: R05_release_gate
    rule: "mainnet selection requires owner_decision.selected_environment includes mainnet AND funding gate closed; otherwise validator returns NOT_PROMOTABLE."
  - id: R06_strk20_json_guard
    rule: "Evidence envelope produced from testnet may never write strk20.json — ledger promotion only from mainnet envelope after independent re-read."

# ---------------------------------------------------------------------------
# How this manifest is consumed (read-only, no deployment side-effect):
# ---------------------------------------------------------------------------
consumers:
  - "Evidence envelope builder: reads manifest.environments[env] for required network/chainId, refuses if owner_decision UNDECIDED."
  - "Harness: asserts observed RPC network == manifest network, chainId == manifest base.chain_id."
  - "sncast / provider templates: env var names declared here — values stay out of repo."
  - "Review (BACKEND_BUNDLE_3T_REVIEW.md): traces this manifest to G1/G2/G3 and EVD-PRISM-004..007."
