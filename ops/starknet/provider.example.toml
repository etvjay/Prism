# Starknet provider / RPC template — SECRET-FREE
# This file documents the env-var contract for STARKNET_RPC_URL / NEXT_PUBLIC_…
# No RPC URL containing a real key is committed. All URLs are read from the environment.
#
# One environment-variable contract (see ops/target-network/manifest.yaml + .env.example):
# PRISM_TARGET_ENV selects the manifest key; names do not change between networks.
#
#   testnet example:
#     PRISM_TARGET_ENV=testnet
#     STARKNET_RPC_URL=https://<SN_SEPOLIA-RPC>/v0_7
#     NEXT_PUBLIC_STARKNET_RPC_URL=https://<SN_SEPOLIA-browser-RPC>/v0_7
#     NEXT_PUBLIC_STARKNET_NETWORK=SN_SEPOLIA
#     BASE_RPC_URL=https://<BASE_SEPOLIA-RPC>
#     BASE_CHAIN_ID=84532
#
#   mainnet example (release-gated; same names, different values):
#     PRISM_TARGET_ENV=mainnet
#     STARKNET_RPC_URL=https://<SN_MAIN-RPC>/v0_7
#     NEXT_PUBLIC_STARKNET_RPC_URL=https://<SN_MAIN-browser-RPC>/v0_7
#     NEXT_PUBLIC_STARKNET_NETWORK=SN_MAIN
#     BASE_RPC_URL=https://<BASE_MAINNET-RPC>
#     BASE_CHAIN_ID=8453
#
# RPC names are environment-neutral and are selected by PRISM_TARGET_ENV:
# STARKNET_RPC_URL and BASE_RPC_URL. Signer names may remain environment-specific,
# for example STARKNET_MAINNET_KEYSTORE_PATH and BASE_MAINNET_SIGNER_PRIVATE_KEY.
# Values stay outside repo.
# Validation (secret-free, no RPC call required until you have a key):
#
#   node ops/starknet/validate.mjs                # checks templates + env contract
#   node --check ops/starknet/validate.mjs        # syntax check only
#   npm run typecheck && npm test                 # bundle hygiene (already required)
#   (cd cairo && scarb build)                                      # Scarb 2.20.0 verified
#   (cd cairo && snforge test)                                  # snforge 0.63.0 verified
#
# When you have a funded deployer account (OFFLINE step, owner-approved):
#
#   sncast --profile sepolia account list         # reads env-configured accounts-file — no secret printed
#   sncast --profile sepolia call --contract-address <ADDR> --function get_identity --calldata <PRISM_ID>
#   # For evidence envelopes, prefer the typed validator `node ops/evidence/validate.mjs <envelope.json>`
#   # over raw RPC copy-paste — it enforces network/chainId/classHash/status/independent-read checks.
